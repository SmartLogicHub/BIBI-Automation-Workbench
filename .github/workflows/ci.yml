name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install playwright openpyxl PyYAML requests

      - name: Run .NET tests
        run: dotnet test .\test\AppServiceTest\AppServiceTest.csproj -c Release

      - name: Run comment executor tests
        run: python -m unittest discover -s .\test\CommentExecutorTests -p "test_*.py" -v
